{% extends 'base.html' %}
{% import 'bootstrap_wtf.html' as wtf %}

{% block content %}
  <h1>{{ _('Sign In') }}</h1>
  {{ wtf.quick_form(form) }}
    <p>
      {{ _('New User?') }} <a href="{{ url_for('register') }}">{{ _('Click here to register') }}</a>
    </p>
  </form>
  <p>
    {{ _('Forgot Your Password?') }}
    <a href="{{ url_for('reset_password_request') }}">{{ _('Click here to reset it') }}</a>
  </p>
{% endblock %}
